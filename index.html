<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goorm 과제 저장소 | 타임라인</title>
    <meta
      name="description"
      content="구름 KDT 과정의 여정을 기록하는 웹 아카이브입니다."
    />
    <style>
      @font-face {
        font-family: "11StreetGothic";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/11StreetGothic-KorLight.woff2")
          format("woff2");
        font-weight: 300;
        font-display: swap;
      }
      @font-face {
        font-family: "11StreetGothic";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/11StreetGothic-Kor.woff2")
          format("woff2");
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "11StreetGothic";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/11StreetGothic-KorBold.woff2")
          format("woff2");
        font-weight: 700;
        font-display: swap;
      }
      :root {
        --primary: #006241;
        --secondary: #e8f5e9;
        --bg: #f8f9fa;
        --accent: #ffeb3b;
        --card-bg: #ffffff;
        --text-main: #333333;
        --text-sub: #888888;
        --border: #eeeeee;
        --cloud-color: #ffffff;
        --arrow-default: #eeeeee;
        --holiday-text: #d32f2f;
      }
      [data-theme="dark"] {
        --primary: #4caf50;
        --secondary: #1b2e21;
        --bg: #121212;
        --accent: #ffd600;
        --card-bg: #1e1e1e;
        --text-main: #e0e0e0;
        --text-sub: #aaaaaa;
        --border: #333333;
        --cloud-color: #2c2c2c;
        --arrow-default: #444444;
        --holiday-text: #ff8a80;
      }
      body {
        font-family: "11StreetGothic", "Pretendard", sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 40px 20px;
        color: var(--text-main);
        transition:
          background 0.3s,
          color 0.3s;
      }
      .container {
        max-width: 750px;
        margin: 0 auto;
      }
      .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--card-bg);
        border: 1px solid var(--border);
        padding: 10px;
        border-radius: 50%;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        z-index: 1000;
        font-size: 1.2rem;
      }
      .header-controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        margin-top: 15px;
      }
      .calendar-btn {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 1.3rem;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
        transition: transform 0.2s;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
      }
      .calendar-btn:hover {
        transform: scale(1.1);
        background: var(--secondary);
      }
      .d-day-badge {
        background: var(--secondary);
        color: var(--primary);
        padding: 8px 16px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.85rem;
        border: 1px solid var(--primary);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      }
      header {
        text-align: center;
        margin-bottom: 50px;
      }
      header h1 {
        color: var(--primary);
        font-size: 2.8rem;
        margin-bottom: 8px;
        font-weight: 700;
      }
      header p {
        color: var(--text-sub);
        font-weight: 300;
      }
      header p.holiday-active {
        color: var(--holiday-text);
        font-weight: 700;
      }
      .loader-wrapper {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 120px 0;
      }
      .cloud {
        width: 120px;
        height: 50px;
        background: var(--cloud-color);
        border-radius: 50px;
        position: relative;
        animation: float 2s ease-in-out infinite;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      }
      .cloud::after,
      .cloud::before {
        content: "";
        position: absolute;
        background: var(--cloud-color);
        border-radius: 50%;
      }
      .cloud::after {
        width: 60px;
        height: 60px;
        top: -30px;
        left: 20px;
      }
      .cloud::before {
        width: 50px;
        height: 50px;
        top: -25px;
        right: 20px;
      }
      .eyes {
        position: absolute;
        width: 40px;
        height: 10px;
        top: 15px;
        left: 40px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
      }
      .eye {
        width: 6px;
        height: 6px;
        background: var(--text-main);
        border-radius: 50%;
        animation: blink 3s infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      @keyframes blink {
        0%,
        90%,
        100% {
          transform: scaleY(1);
        }
        95% {
          transform: scaleY(0.1);
        }
      }
      .loading-text {
        margin-top: 35px;
        color: var(--primary);
        font-weight: 700;
      }
      details {
        background: var(--card-bg);
        margin-bottom: 20px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        transition: transform 0.3s;
      }
      details:hover {
        transform: translateY(-3px);
      }
      summary {
        padding: 24px 28px;
        font-weight: 700;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      details[open] summary {
        background: var(--secondary);
        color: var(--primary);
        border-bottom: 1px solid var(--border);
      }
      .task-list {
        padding: 5px 15px 20px;
      }
      .task-row {
        margin-bottom: 10px;
        border-radius: 15px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .task-header {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        text-decoration: none;
        color: var(--text-main);
        background: var(--card-bg);
        cursor: pointer;
        transition: all 0.2s;
        border: none;
        width: 100%;
        font-family: inherit;
      }
      .task-header:hover {
        background: var(--bg);
        color: var(--primary);
      }
      .tag {
        width: 60px;
        text-align: center;
        font-size: 0.7rem;
        padding: 4px 0;
        border-radius: 8px;
        font-weight: 800;
        margin-right: 20px;
        flex-shrink: 0;
      }
      .tag.quiz {
        background: var(--accent);
        color: #856404;
      }
      .tag.task {
        background: var(--border);
        color: var(--text-sub);
      }
      .task-date {
        color: var(--text-sub);
        font-weight: 600;
        margin-right: 15px;
        width: 75px;
        flex-shrink: 0;
      }
      .task-title {
        font-weight: 700;
        flex-grow: 1;
        font-size: 1.05rem;
        text-align: left;
      }
      .arrow {
        color: var(--arrow-default);
        font-size: 1.2rem;
        transition: all 0.3s ease;
      }
      .file-count {
        font-size: 0.72rem;
        background: var(--secondary);
        color: var(--primary);
        padding: 3px 8px;
        border-radius: 10px;
        font-weight: 700;
        margin-right: 10px;
        white-space: nowrap;
      }
      .file-list {
        display: none;
        border-top: 1px solid var(--border);
        background: var(--bg);
      }
      .file-list.open {
        display: block;
      }
      .file-link {
        display: flex;
        align-items: center;
        padding: 12px 20px 12px 40px;
        text-decoration: none;
        color: var(--text-sub);
        font-size: 0.9rem;
        border-bottom: 1px solid var(--border);
        transition: all 0.2s;
        gap: 10px;
      }
      .file-link:hover {
        background: var(--secondary);
        color: var(--primary);
        padding-left: 48px;
      }
      .file-icon {
        font-size: 0.85rem;
        flex-shrink: 0;
      }
      .file-name {
        flex-grow: 1;
      }
      .file-arrow {
        font-size: 0.9rem;
        color: var(--arrow-default);
        transition: all 0.2s;
      }
      .task-row.expanded .arrow {
        transform: rotate(90deg);
        color: var(--primary);
      }
    </style>
  </head>
  <body>
    <button class="theme-toggle" id="theme-btn" title="테마 변경">🌓</button>

    <div class="container">
      <header>
        <h1>WEB ARCHIVE</h1>
        <p id="today-schedule">오늘도 코딩 중!</p>
        <div class="header-controls">
          <a href="curriculum.html" class="calendar-btn" title="전체 일정 보기"
            >📅</a
          >
          <div id="d-day-badge" class="d-day-badge">D-Day 계산 중...</div>
        </div>
      </header>

      <div id="loader" class="loader-wrapper">
        <div class="cloud">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
        </div>
        <div class="loading-text">파일을 찾으러 하늘을 날고 있어요</div>
      </div>

      <div id="task-container" style="display: none"></div>
    </div>

    <script>
      // ── 테마 & D-Day ── //
      const themeBtn = document.getElementById("theme-btn");
      const savedTheme = localStorage.getItem("theme") || "light";
      document.documentElement.setAttribute("data-theme", savedTheme);
      themeBtn.addEventListener("click", () => {
        const cur = document.documentElement.getAttribute("data-theme");
        const next = cur === "dark" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", next);
        localStorage.setItem("theme", next);
      });

      function updateDDay() {
        const targetDate = new Date("2026-07-16T00:00:00");
        const diff = targetDate - new Date();
        const daysLeft = Math.ceil(diff / 86400000);
        const badge = document.getElementById("d-day-badge");
        if (daysLeft > 0)
          badge.innerHTML = `🎓 수료까지 <strong>D-${daysLeft}</strong>`;
        else if (daysLeft === 0)
          badge.innerHTML = `🎉 <strong>Today is the Day!</strong>`;
        else badge.innerHTML = `✨ <strong>수료 완료!</strong>`;
      }

      function updateTodaySchedule() {
        const holidays = [
          "2026-02-16",
          "2026-02-17",
          "2026-02-18",
          "2026-02-19",
          "2026-03-02",
          "2026-03-12",
          "2026-05-05",
          "2026-05-08",
          "2026-05-25",
          "2026-06-03",
        ];
        const now = new Date();
        const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
        const el = document.getElementById("today-schedule");
        if (holidays.includes(todayStr)) {
          el.innerHTML = "🏖️ 오늘은 <strong>휴강일</strong>입니다. 푹 쉬세요!";
          el.classList.add("holiday-active");
        } else {
          el.innerHTML = "오늘도 코딩 중! 💻";
          el.classList.remove("holiday-active");
        }
      }

      updateDDay();
      updateTodaySchedule();

      // ── GitHub API ──
      async function fetchWeeklyData() {
        const owner = "khy0819";
        const repo = "Goormexp";
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`;

        try {
          const res = await fetch(apiUrl);
          const data = await res.json();

          // ⚠️ 수정 포인트: 더 깔끔한 필터링 및 경로 처리
          const htmlFiles = data.tree.filter(
            (f) =>
              f.path.includes("assignments/") &&
              f.path.endsWith(".html") &&
              f.path !== "index.html" &&
              !f.path.includes("node_modules"),
          );

          const taskMap = new Map();

          htmlFiles.forEach((f) => {
            const parts = f.path.split("/");

            const weekFolder = parts.find((p) =>
              p.toLowerCase().includes("week"),
            );
            const weekLabel = weekFolder
              ? weekFolder.toUpperCase().replace(/_/g, " ")
              : "기타 분류";

            const distIdx = parts.indexOf("dist");
            const taskFolderName =
              distIdx >= 0 ? parts[distIdx - 1] : parts[parts.length - 2];

            const rawFileName = parts[parts.length - 1];
            const displayName =
              rawFileName === "index.html" ? "메인 앱 실행" : rawFileName;

            if (!taskMap.has(taskFolderName)) {
              taskMap.set(taskFolderName, { weekLabel, files: [] });
            }

            const entry = taskMap.get(taskFolderName);

            const alreadyIdx = entry.files.findIndex(
              (x) => x.displayName === displayName,
            );
            if (alreadyIdx === -1) {
              entry.files.push({ path: f.path, displayName });
            } else if (distIdx >= 0) {
              entry.files[alreadyIdx] = { path: f.path, displayName };
            }
          });

          const weeks = {};
          taskMap.forEach((val, taskFolderName) => {
            const { weekLabel, files } = val;
            if (!weeks[weekLabel]) weeks[weekLabel] = [];
            weeks[weekLabel].push({ name: taskFolderName, files });
          });

          const container = document.getElementById("task-container");
          document.getElementById("loader").style.display = "none";
          container.style.display = "block";

          Object.keys(weeks)
            .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
            .forEach((week) => {
              const details = document.createElement("details");
              const tasks = weeks[week].sort((a, b) =>
                a.name.localeCompare(b.name),
              );

              let html = `<summary><span>📂 ${week}</span><span style="font-size:0.8rem;opacity:0.4;">${tasks.length} Tasks</span></summary><div class="task-list">`;

              tasks.forEach((task) => {
                const parts = task.name.split("-");
                const isQuiz = task.name.toUpperCase().includes("QUIZ");
                const dateStr = parts[0] || "";
                const titleStr =
                  parts
                    .slice(1)
                    .join("-")
                    .replace(/^(QUIZ|TASK)[-_]?/i, "")
                    .trim() || "과제물";
                const fileCount = task.files.length;

                if (fileCount === 1) {
                  html += `<div class="task-row"><a href="${encodeURI(task.files[0].path)}" class="task-header single"><span class="tag ${isQuiz ? "quiz" : "task"}">${isQuiz ? "QUIZ" : "TASK"}</span><span class="task-date">${dateStr}</span><span class="task-title">${titleStr}</span><span class="arrow">→</span></a></div>`;
                } else {
                  const rowId = `row-${task.name.replace(/\s/g, "-")}`;
                  html += `<div class="task-row" id="${rowId}"><button class="task-header" onclick="toggleFiles('${rowId}')"><span class="tag ${isQuiz ? "quiz" : "task"}">${isQuiz ? "QUIZ" : "TASK"}</span><span class="task-date">${dateStr}</span><span class="task-title">${titleStr}</span><span class="file-count">${fileCount}개 파일</span><span class="arrow">›</span></button><div class="file-list" id="files-${rowId}">`;
                  task.files
                    .sort((a, b) => a.displayName.localeCompare(b.displayName))
                    .forEach((file) => {
                      html += `<a href="${encodeURI(file.path)}" class="file-link"><span class="file-icon">📄</span><span class="file-name">${file.displayName}</span><span class="file-arrow">→</span></a>`;
                    });
                  html += `</div></div>`;
                }
              });
              html += `</div>`;
              details.innerHTML = html;
              container.appendChild(details);
            });
        } catch (e) {
          document.getElementById("loader").innerHTML =
            "☁️ 데이터 로드에 실패했습니다.";
        }
      }

      function toggleFiles(rowId) {
        const row = document.getElementById(rowId);
        const list = document.getElementById(`files-${rowId}`);
        row.classList.toggle("expanded");
        list.classList.toggle("open");
      }

      fetchWeeklyData();
    </script>
  </body>
</html>
