<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goorm 과제 저장소 | 타임라인</title>
    <style>
      /* --- 디자인 스타일 --- */
      @font-face {
        font-family: "11StreetGothic";
        src: url("https://cdn.jsdelivr.net/gh/projectnoonnu/2601-4@1.1/11StreetGothic-Kor.woff2")
          format("woff2");
        font-display: swap;
      }
      :root {
        --primary: #006241;
        --secondary: #e8f5e9;
        --bg: #f8f9fa;
        --card-bg: #ffffff;
        --text-main: #333333;
        --border: #eeeeee;
      }
      body {
        font-family: "11StreetGothic", sans-serif;
        background: var(--bg);
        margin: 0;
        padding: 40px 20px;
        color: var(--text-main);
      }
      .container {
        max-width: 750px;
        margin: 0 auto;
      }
      header {
        text-align: center;
        margin-bottom: 50px;
      }
      header h1 {
        color: var(--primary);
        font-size: 2.8rem;
      }
      details {
        background: var(--card-bg);
        margin-bottom: 20px;
        border-radius: 20px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
        overflow: hidden;
      }
      summary {
        padding: 24px 28px;
        font-weight: 700;
        cursor: pointer;
        list-style: none;
        display: flex;
        justify-content: space-between;
      }
      .task-list {
        padding: 10px 20px 20px;
      }
      .task-row {
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: 15px;
        overflow: hidden;
      }
      .task-header {
        display: flex;
        align-items: center;
        padding: 16px 20px;
        text-decoration: none;
        color: var(--text-main);
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        cursor: pointer;
        font-family: inherit;
      }
      .tag {
        width: 60px;
        text-align: center;
        font-size: 0.7rem;
        padding: 4px 0;
        border-radius: 8px;
        font-weight: 800;
        margin-right: 20px;
        background: var(--border);
      }
      .file-list {
        display: none;
        background: var(--bg);
        border-top: 1px solid var(--border);
      }
      .file-list.open {
        display: block;
      }
      .file-link {
        display: flex;
        align-items: center;
        padding: 12px 20px 12px 40px;
        text-decoration: none;
        color: #666;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--border);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>WEB ARCHIVE</h1>
        <p>구름 KDT 과정 과제물 저장소</p>
      </header>

      <div id="loader" style="text-align: center; padding: 100px">
        하늘에서 파일을 가져오는 중... ☁️
      </div>
      <div id="task-container" style="display: none"></div>
    </div>

    <script>
      async function fetchWeeklyData() {
        const owner = "khy0819";
        const repo = "Goormexp";
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/main?recursive=1`;

        try {
          const res = await fetch(apiUrl);
          const data = await res.json();

          const htmlFiles = data.tree.filter(
            (f) =>
              f.path.includes("assignments/") &&
              f.path.endsWith(".html") &&
              !f.path.includes("node_modules"),
          );

          const taskMap = new Map();

          htmlFiles.forEach((f) => {
            const parts = f.path.split("/");
            const weekFolder = parts.find((p) =>
              p.toLowerCase().includes("week"),
            );
            const weekLabel = weekFolder
              ? weekFolder.toUpperCase().replace(/_/g, " ")
              : "기타 분류";

            const distIdx = parts.indexOf("dist");
            const taskFolderName =
              distIdx >= 0 ? parts[distIdx - 1] : parts[parts.length - 2];
            const rawFileName = parts[parts.length - 1];

            let finalPath = f.path;
            let displayName = rawFileName;

            // ✨ [핵심 수정]
            // 1. dist 안에 있는 index.html만 실행 버튼으로 표시
            if (distIdx >= 0 && rawFileName === "index.html") {
              displayName = "🚀 메인 앱 실행 (React)";
              finalPath = f.path.replace("index.html", "");
            }
            // 2. dist 밖에 있는(원본 소스) index.html은 목록에서 제외함 (흰 화면 방지)
            else if (distIdx === -1 && rawFileName === "index.html") {
              return;
            }

            if (!taskMap.has(taskFolderName)) {
              taskMap.set(taskFolderName, { weekLabel, files: [] });
            }

            const entry = taskMap.get(taskFolderName);

            // 중복 체크 및 등록
            const alreadyIdx = entry.files.findIndex(
              (x) => x.displayName === displayName,
            );
            if (alreadyIdx === -1) {
              entry.files.push({ path: finalPath, displayName });
            } else if (distIdx >= 0) {
              // dist 버전이 나중에 발견되더라도 덮어쓰기
              entry.files[alreadyIdx] = { path: finalPath, displayName };
            }
          });

          renderTasks(taskMap);
        } catch (e) {
          document.getElementById("loader").innerHTML =
            "☁️ 데이터를 가져오지 못했습니다.";
        }
      }

      function renderTasks(taskMap) {
        const container = document.getElementById("task-container");
        document.getElementById("loader").style.display = "none";
        container.style.display = "block";

        const weeks = {};
        taskMap.forEach((val) => {
          if (!weeks[val.weekLabel]) weeks[val.weekLabel] = [];
          weeks[val.weekLabel].push(val);
        });

        Object.keys(weeks)
          .sort()
          .forEach((week) => {
            const details = document.createElement("details");
            let html = `<summary>📂 ${week}</summary><div class="task-list">`;

            // 주차별 정렬 및 렌더링
            const sortedTasks = weeks[week];

            taskMap.forEach((task, name) => {
              if (task.weekLabel !== week) return;
              const fileCount = task.files.length;
              const rowId = `row-${name.replace(/\s/g, "-")}`;

              if (fileCount === 1) {
                html += `
                <div class="task-row">
                  <a href="${encodeURI(task.files[0].path)}" class="task-header">
                    <span class="tag">TASK</span>
                    <span style="flex-grow:1; font-weight:700;">${name}</span>
                    <span>→</span>
                  </a>
                </div>`;
              } else {
                html += `
                <div class="task-row" id="${rowId}">
                  <button class="task-header" onclick="toggleFiles('${rowId}')">
                    <span class="tag">TASK</span>
                    <span style="flex-grow:1; font-weight:700;">${name}</span>
                    <span style="font-size:0.8rem; margin-right:10px; color:#006241;">${fileCount}개 파일</span>
                    <span>›</span>
                  </button>
                  <div class="file-list" id="files-${rowId}">
                    ${task.files
                      .sort((a, b) =>
                        a.displayName.localeCompare(b.displayName),
                      )
                      .map(
                        (file) =>
                          `<a href="${encodeURI(file.path)}" class="file-link">📄 ${file.displayName}</a>`,
                      )
                      .join("")}
                  </div>
                </div>`;
              }
            });
            html += `</div>`;
            details.innerHTML = html;
            container.appendChild(details);
          });
      }

      function toggleFiles(rowId) {
        document.getElementById(`files-${rowId}`).classList.toggle("open");
      }

      fetchWeeklyData();
    </script>
  </body>
</html>
